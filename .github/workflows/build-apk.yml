name: FlyBrain release validation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow

      - name: Download and verify pinned MaleCNS v1.0 source
        run: python tools/prepare_malecns.py --download

      - name: Build canonical FBR-10-OLF1
        run: python tools/build_connectome.py

      - name: Run structural/static validation
        run: |
          python tools/test_fbc103_reader.py
          python tools/test_food_function_audit.py
          python tools/test_frozen_connectome_validator.py
          python tools/test_neural_time_integration.py
          python tools/test_olfactory_input_map.py
          python tools/test_olfactory_route_reduction.py
          python tools/test_phase2b_temporal_substepping.py
          python tools/test_sensory_input_purity.py
          python tools/test_vnc_motor_semantics_logic.py
          python tools/validate_fbr10_olf1.py --fbc103 app/src/main/res/raw/malecns_reduced.bin --report app/src/main/res/raw/malecns_reduced_report.json
          python tools/validate_generated_connectome.py

      - name: Generate runtime maps
        run: |
          mkdir -p app/src/main/assets
          python tools/build_sensory_input_map.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/sensory_input_map.tsv \
            --report build/SENSORY_INPUT_MAP_REPORT.json
          python tools/build_olfactory_input_map.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --neurotransmitters build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/olfactory_input_map.tsv \
            --report build/OLFACTORY_INPUT_MAP_REPORT.json \
            --connectome-report app/src/main/res/raw/malecns_reduced_report.json
          python tools/build_vnc_motor_semantics.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/vnc_motor_semantics.tsv \
            --report build/VNC_MOTOR_SEMANTICS_REPORT.json

      - name: Build FBD104
        run: |
          python tools/build_fbr10_dynamics.py             --nt build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather             --expected-structural-sha 0044ab166af3439f2b86d4e6c5897481a1c3f28a58b6afb2c4f761489b276bbf

      - name: Validate FBD104 provenance
        run: python tools/validate_fbr10_dynamics.py

      - name: Assemble APK
        run: ./gradlew :app:assembleDebug
