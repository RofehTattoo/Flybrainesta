name: Build FlyBrain APK V1.17.0-FOOD-OLFACTORY-ROUTED · FBR-10-OLF1 + FBD104 + VNC semantics

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install validation dependencies (MaleCNS reduction pipeline)
        run: python -m pip install --upgrade pip pyarrow==19.0.1 pandas==2.2.3

      - name: Download exact official MaleCNS annotations
        run: |
          set -euo pipefail
          mkdir -p build/malecns_raw app/src/main/assets
          URL='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
          echo '2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2  build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather' | sha256sum -c -
          echo 'OFFICIAL ANNOTATIONS: OK'

      - name: Download exact official MaleCNS neurotransmitters
        run: |
          set -euo pipefail
          mkdir -p build/malecns_raw
          URL='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather
          echo '95c9289220663abeb3409f3ad9e5a7f8a53f8093f5139d15502cd08da8879621  build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather' | sha256sum -c -
          echo 'OFFICIAL NEUROTRANSMITTERS: OK'

      - name: Download exact official MaleCNS connectome weights
        run: |
          set -euo pipefail
          mkdir -p build/malecns_raw
          URL='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o build/malecns_raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather
          echo 'e35da783d1c686b2b58b3b87cd6a403ae43bfcfba8bff28e08ef752c1a56afc1  build/malecns_raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather' | sha256sum -c -
          echo 'OFFICIAL WEIGHTS: OK'

      - name: Audit FBR-10-OLF1 reducer logic
        run: |
          set -euo pipefail
          python -m py_compile tools/build_connectome.py tools/test_olfactory_route_reduction.py
          python tools/test_olfactory_route_reduction.py

      - name: Build new FBR-10-OLF1 connectome
        run: |
          set -euo pipefail
          python tools/build_connectome.py
          test -s app/src/main/res/raw/malecns_reduced.bin
          test -s app/src/main/res/raw/malecns_reduced_report.json

      - name: Build and validate anatomical olfactory input map
        run: |
          set -euo pipefail
          python -m py_compile tools/build_olfactory_input_map.py tools/test_olfactory_input_map.py
          python tools/build_olfactory_input_map.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --neurotransmitters build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/olfactory_input_map.tsv \
            --report build/OLF_INPUT_MAP_REPORT.json \
            --connectome-report app/src/main/res/raw/malecns_reduced_report.json
          cp build/OLF_INPUT_MAP_REPORT.json app/src/main/res/raw/olfactory_input_map_report.json
          python tools/test_olfactory_input_map.py
          test -s app/src/main/assets/olfactory_input_map.tsv

      - name: Build and validate V1.17.0 VNC semantics
        run: |
          set -euo pipefail
          python -m py_compile tools/build_vnc_motor_semantics.py tools/validate_vnc_motor_semantics.py tools/test_vnc_motor_semantics_logic.py
          python tools/test_vnc_motor_semantics_logic.py
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/build_vnc_motor_semantics.py').read_text()
          assert 'read_feather(' not in s, 'VNC semantics builder must not require pandas'
          assert 'feather.read_table(' in s, 'VNC semantics builder must use Arrow-native Feather reading'
          print('VNC FEATHER READER: PANDAS-FREE')
          PY
          python tools/build_vnc_motor_semantics.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/vnc_motor_semantics.tsv \
            --report build/VNC_MOTOR_SEMANTICS_REPORT.json
          python tools/validate_vnc_motor_semantics.py \
            --semantics app/src/main/assets/vnc_motor_semantics.tsv \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --report build/VNC_MOTOR_SEMANTICS_REPORT.json
          cp build/VNC_MOTOR_SEMANTICS_REPORT.json app/src/main/res/raw/vnc_motor_semantics_report.json
          test -s app/src/main/assets/vnc_motor_semantics.tsv
          test -s app/src/main/res/raw/vnc_motor_semantics_report.json

      - name: Build FBD104 signed dynamics layer
        run: |
          set -euo pipefail
          NT='build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather'
          test -s "$NT"
          python -m py_compile tools/build_fbr10_dynamics.py tools/validate_fbr10_dynamics.py
          python tools/build_fbr10_dynamics.py --nt "$NT" --output app/src/main/res/raw/malecns_fbr10_dynamics.bin
          python tools/validate_fbr10_dynamics.py
          cp build/FBR10_DYNAMICS_REPORT.json app/src/main/res/raw/malecns_fbr10_dynamics_report.json

      - name: Validate new FBR-10-OLF1 connectome
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_fbr10_olf1.py
          python tools/validate_fbr10_olf1.py \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --report app/src/main/res/raw/malecns_reduced_report.json

      - name: Validate V1.17.0 membrane integration
        run: |
          set -euo pipefail
          python -m py_compile tools/test_neural_time_integration.py
          python tools/test_neural_time_integration.py

      - name: Validate Kotlin source structure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/example/flybrain/MainActivity.kt').read_text()
          assert s.count('{') == s.count('}')
          assert s.count('(') == s.count(')')
          assert s.count('[') == s.count(']')
          assert 'calibrateSynapticGain' not in s
          assert 'java.util.Arrays.fill(sensoryCurrent, 0f)' in s
          assert 'loadDynamicsLayer()' in s
          assert 'loadVncMotorSemantics()' in s
          assert 'vnc_motor_semantics.tsv' in s
          assert 'val expectedHeader = "bodyId\\ttype\\tclass' in s, 'VNCSEM header must use real Kotlin tab escapes'
          assert 'bodyId\\\\ttype' not in s, 'VNCSEM header must not contain literal backslash-t sequences'
          assert 'MOTOR_FUNCTION_JUMP' in s
          assert 'externalContext' not in s
          assert 'INDEX-CYCLIC' not in s
          assert 'FOOD_OLF_PATTERN_CAP' not in s
          assert 'for (i in olfactoryNeuronIndices)' in s
          assert 'excludeOlfactory = true' in s
          assert 'olfactoryPopulationRate()' in s
          assert 'mechanosensoryPopulationRate()' in s
          print('KOTLIN STRUCTURE: OK')
          PY

      - name: Validate FBD104 artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct, hashlib
          from pathlib import Path
          fbc=Path('app/src/main/res/raw/malecns_reduced.bin')
          p=Path('app/src/main/res/raw/malecns_fbr10_dynamics.bin'); b=p.read_bytes()
          sb=fbc.read_bytes(); fn,fe=struct.unpack_from('<II',sb,8)
          assert b[:8] == b'FBD104\x00\x00'
          n,e=struct.unpack_from('<II',b,8)
          assert n==fn==16669 and len(b)==16+n+e*12
          d=json.loads(Path('build/FBR10_DYNAMICS_REPORT.json').read_text())
          assert d['neurons']==n and d['structural_edges']==fe
          assert d['source_structural_sha256']==hashlib.sha256(sb).hexdigest()
          print('FBD104: OK')
          PY

      - name: Compile APK V1.17.0-FOOD-OLFACTORY-ROUTED
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK V1.17.0-FOOD-OLFACTORY-ROUTED
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -Fq "versionCode='131'"
          echo "$BADGING" | grep -Fq "versionName='1.17.0'"
          unzip -l "$APK" | grep -Fq 'malecns_reduced.bin'
          unzip -l "$APK" | grep -Fq 'malecns_fbr10_dynamics.bin'
          unzip -l "$APK" | grep -Fq 'vnc_motor_semantics.tsv'
          unzip -l "$APK" | grep -Fq 'vnc_motor_semantics_report.json'
          sha256sum "$APK"

      - name: Upload V1.17.0 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.17.0-OLF1-AUDIT-EVIDENCE
          path: |
            app/src/main/res/raw/malecns_reduced.bin
            app/src/main/res/raw/malecns_reduced_report.json
            app/src/main/res/raw/malecns_fbr10_dynamics.bin
            app/src/main/res/raw/malecns_fbr10_dynamics_report.json
            app/src/main/res/raw/vnc_motor_semantics_report.json
            app/src/main/res/raw/olfactory_input_map_report.json
            app/src/main/assets/olfactory_input_map.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.17.0-FOOD-OLFACTORY-ROUTED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
