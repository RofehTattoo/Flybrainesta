name: Build FlyBrain APK V1.17.0-FOOD-OLFACTORY-ROUTED · FBR-10-OLF1 + FBD104 + VNC semantics

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install validation dependencies (MaleCNS reduction pipeline)
        run: python -m pip install --upgrade pip pyarrow==19.0.1 pandas==2.2.3

      - name: Download exact official MaleCNS annotations
        run: |
          set -euo pipefail
          mkdir -p build/malecns_raw app/src/main/assets
          URL='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
          echo '2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2  build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather' | sha256sum -c -
          echo 'OFFICIAL ANNOTATIONS: OK'

      - name: Diagnose MaleCNS v1.0 ORN census
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd

          p = 'build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather'
          a = pd.read_feather(p)

          def norm(v):
              return '' if pd.isna(v) else str(v).strip()

          sc = a['superclass'].map(norm).str.lower()
          cl = a['class'].map(norm).str.lower()
          typ = a['type'].map(norm).str.upper()
          nerve = a['entryNerve'].map(norm).str.upper()

          # ------------------------------------------------------------
          # DEFINICIONES INDEPENDIENTES
          # ------------------------------------------------------------

          m_sc_cb = sc.eq('cb_sensory')
          m_class_olf = cl.eq('olfactory')
          m_type_orn_prefix = typ.str.startswith('ORN_')
          m_type_orn_any = typ.str.contains('ORN', regex=False)

          # A: selector ORN actualmente utilizado
          mask_A = m_sc_cb & m_class_olf & m_type_orn_prefix

          # B/C/D: combinaciones para localizar qué predicado excluye filas
          mask_B = m_sc_cb & m_class_olf
          mask_C = m_sc_cb & m_type_orn_prefix
          mask_D = m_class_olf & m_type_orn_prefix

          # E: cualquier type que contenga ORN
          mask_E = m_type_orn_any

          # ------------------------------------------------------------
          # CENSOS
          # ------------------------------------------------------------

          print('')
          print('============================================================')
          print('MALECNS v1.0 ORN CENSUS DIAGNOSTIC')
          print('============================================================')
          print(f'TOTAL ANNOTATION ROWS: {len(a)}')
          print(f'UNIQUE bodyId: {a["bodyId"].nunique()}')
          print('')

          print('INDEPENDENT CENSUSES:')
          print(f'B cb_sensory + olfactory:          {int(mask_B.sum())}')
          print(f'C cb_sensory + ORN_*:              {int(mask_C.sum())}')
          print(f'D olfactory + ORN_*:               {int(mask_D.sum())}')
          print(f'E type contains "ORN":              {int(mask_E.sum())}')
          print(f'A cb_sensory + olfactory + ORN_*:   {int(mask_A.sum())}')
          print('')

          # ------------------------------------------------------------
          # ENTRY NERVE
          # ------------------------------------------------------------

          selected = mask_A & nerve.isin(['AN', 'MXLBN'])

          print('ENTRY NERVE:')
          print(f'A selected by AN/MXLBN:             {int(selected.sum())}')
          print('')
          print(nerve.loc[mask_A].value_counts(dropna=False).to_string())
          print('')

          # ------------------------------------------------------------
          # DIFERENCIAS ENTRE CONJUNTOS
          # ------------------------------------------------------------

          def show_diff(title, left_mask, right_mask):
              idx = a.index[left_mask & ~right_mask]
              print('')
              print('------------------------------------------------------------')
              print(title)
              print(f'COUNT: {len(idx)}')
              print('------------------------------------------------------------')

              if len(idx):
                  cols = [
                      'bodyId',
                      'type',
                      'class',
                      'superclass',
                      'entryNerve',
                      'somaSide',
                      'rootSide',
                      'status'
                  ]
                  print(a.loc[idx, cols].to_string(index=False))
              else:
                  print('(none)')

          show_diff(
              'B - A : cb_sensory + olfactory BUT NOT ORN_*',
              mask_B,
              mask_A
          )

          show_diff(
              'C - A : cb_sensory + ORN_* BUT NOT olfactory',
              mask_C,
              mask_A
          )

          show_diff(
              'D - A : olfactory + ORN_* BUT NOT cb_sensory',
              mask_D,
              mask_A
          )

          show_diff(
              'E - A : type contains ORN BUT does NOT satisfy A',
              mask_E,
              mask_A
          )

          # ------------------------------------------------------------
          # CANDIDATOS SOSPECHOSOS
          #
          # Cualquier fila que parezca ORN por al menos uno de los
          # criterios, pero que no entre en A.
          # ------------------------------------------------------------

          suspicious = (mask_B | mask_C | mask_D | mask_E) & ~mask_A

          print('')
          print('============================================================')
          print('ALL SUSPICIOUS ORN CANDIDATES OUTSIDE A')
          print('============================================================')
          print(f'COUNT: {int(suspicious.sum())}')

          if suspicious.any():
              cols = [
                  'bodyId',
                  'type',
                  'class',
                  'superclass',
                  'entryNerve',
                  'somaSide',
                  'rootSide',
                  'status'
              ]
              print(a.loc[suspicious, cols].to_string(index=False))
          else:
              print('(none)')

          # ------------------------------------------------------------
          # DISTRIBUCIONES DE LOS CAMPOS RELEVANTES
          # ------------------------------------------------------------

          print('')
          print('============================================================')
          print('OLFACTORY CLASS TYPE DISTRIBUTION')
          print('============================================================')

          olf_rows = a.loc[m_class_olf, ['type', 'superclass', 'entryNerve']].copy()

          if len(olf_rows):
              print(olf_rows.groupby(
                  ['superclass', 'type', 'entryNerve'],
                  dropna=False
              ).size().sort_values(ascending=False).to_string())
          else:
              print('(none)')

          print('')
          print('============================================================')
          print('ORN-LIKE TYPE DISTRIBUTION')
          print('============================================================')

          orn_like = a.loc[m_type_orn_any, ['type', 'class', 'superclass', 'entryNerve']].copy()

          if len(orn_like):
              print(orn_like.groupby(
                  ['type', 'class', 'superclass', 'entryNerve'],
                  dropna=False
              ).size().sort_values(ascending=False).to_string())
          else:
              print('(none)')

          print('')
          print('============================================================')
          print('END ORN CENSUS DIAGNOSTIC')
          print('============================================================')

          if len(a.loc[mask_A]) == 2639:
              print('RESULT: BASE ORN CENSUS = 2639 PASS')
          else:
              print(f'RESULT: BASE ORN CENSUS = {int(mask_A.sum())} / EXPECTED 2639')
          PY

      - name: Download exact official MaleCNS neurotransmitters
        run: |
          set -euo pipefail
          mkdir -p build/malecns_raw
          URL='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather
          echo '95c9289220663abeb3409f3ad9e5a7f8a53f8093f5139d15502cd08da8879621  build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather' | sha256sum -c -
          echo 'OFFICIAL NEUROTRANSMITTERS: OK'


      - name: Diagnose four missing MaleCNS ORNs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pandas as pd

          ANNOTATIONS = 'build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather'
          NEUROTRANSMITTERS = 'build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather'
          TARGET_IDS = [242812, 242908, 488209, 956041]

          def norm(v):
              return '' if pd.isna(v) else str(v).strip()

          def print_section(title):
              print('')
              print('=' * 80)
              print(title)
              print('=' * 80)

          annotations = pd.read_feather(ANNOTATIONS)
          nt = pd.read_feather(NEUROTRANSMITTERS)

          print_section('FOUR MISSING ORN DIAGNOSTIC')
          print('TARGET BODY IDS:')
          print(TARGET_IDS)

          print_section('ANNOTATIONS FILE STRUCTURE')
          print(f'Rows: {len(annotations)}')
          print(f'Columns ({len(annotations.columns)}):')
          for c in annotations.columns:
              print(f'  {c}: {annotations[c].dtype}')

          print_section('NEUROTRANSMITTER FILE STRUCTURE')
          print(f'Rows: {len(nt)}')
          print(f'Columns ({len(nt.columns)}):')
          for c in nt.columns:
              print(f'  {c}: {nt[c].dtype}')

          if 'bodyId' not in annotations.columns:
              raise RuntimeError('Annotations file has no bodyId column')

          target_rows = annotations.loc[annotations['bodyId'].isin(TARGET_IDS)].copy()

          print_section('TARGET ANNOTATION ROWS')
          print(f'Rows found: {len(target_rows)}')
          if len(target_rows):
              print(target_rows.to_string(index=False))
          else:
              print('NO TARGET ROWS FOUND')

          print_section('TARGET BODYID UNIQUENESS')
          for body_id in TARGET_IDS:
              rows = annotations.loc[annotations['bodyId'].eq(body_id)]
              print(f'bodyId {body_id}: {len(rows)} annotation row(s)')

          core_fields = [
              'bodyId', 'type', 'class', 'superclass', 'subclass',
              'instance', 'receptorType', 'entryNerve', 'somaSide',
              'rootSide', 'status'
          ]
          available_core = [c for c in core_fields if c in annotations.columns]

          print_section('TARGET CORE ANATOMICAL FIELDS')
          if len(target_rows):
              print(target_rows[available_core].sort_values('bodyId').to_string(index=False))

          print_section('TARGET RECORDS — COMPLETE DICTIONARIES')
          for body_id in TARGET_IDS:
              rows = annotations.loc[annotations['bodyId'].eq(body_id)]
              print('')
              print(f'BODYID {body_id}')
              if rows.empty:
                  print('  NOT FOUND')
                  continue
              for record in rows.to_dict(orient='records'):
                  clean = {}
                  for key, value in record.items():
                      if pd.isna(value):
                          clean[key] = None
                      elif hasattr(value, 'item'):
                          try:
                              clean[key] = value.item()
                          except Exception:
                              clean[key] = str(value)
                      else:
                          clean[key] = value
                  print(json.dumps(clean, ensure_ascii=False, default=str))

          sc = annotations['superclass'].map(norm).str.lower()
          cl = annotations['class'].map(norm).str.lower()
          typ = annotations['type'].map(norm).str.upper()

          normal_orn_mask = (
              sc.eq('cb_sensory')
              & cl.eq('olfactory')
              & typ.str.startswith('ORN_')
          )
          normal_orns = annotations.loc[normal_orn_mask].copy()

          print_section('NORMAL ORN COMPARISON')
          print(f'Normal ORN rows: {len(normal_orns)}')

          comparison_fields = [
              'bodyId', 'type', 'class', 'superclass', 'subclass',
              'instance', 'receptorType', 'entryNerve', 'somaSide',
              'rootSide', 'status'
          ]
          available_comparison = [c for c in comparison_fields if c in annotations.columns]

          for field in available_comparison:
              if field == 'bodyId':
                  continue
              print('')
              print(f'NORMAL ORN DISTRIBUTION — {field}')
              print(normal_orns[field].map(norm).value_counts(dropna=False).head(100).to_string())

          print_section('TARGET VALUES VS NORMAL ORN VALUES')
          for body_id in TARGET_IDS:
              rows = annotations.loc[annotations['bodyId'].eq(body_id)]
              print('')
              print(f'BODYID {body_id}')
              if rows.empty:
                  print('  NOT FOUND')
                  continue
              row = rows.iloc[0]
              for field in available_comparison:
                  if field == 'bodyId':
                      continue
                  value = row[field]
                  value_norm = '<NULL>' if pd.isna(value) else str(value).strip()
                  normal_values = set(
                      normal_orns[field].dropna().astype(str).str.strip().tolist()
                  )
                  present = 'NULL' if value_norm == '<NULL>' else (
                      'PRESENT' if value_norm in normal_values else 'NEW_VALUE'
                  )
                  print(f'  {field}: {value_norm!r} [{present}]')

          print_section('TARGET NEUROTRANSMITTER RECORDS')
          if 'body' not in nt.columns:
              raise RuntimeError('Neurotransmitter file has no body column')
          nt_target = nt.loc[nt['body'].isin(TARGET_IDS)].copy()
          print(f'Neurotransmitter rows found: {len(nt_target)}')
          if len(nt_target):
              print(nt_target.to_string(index=False))
          else:
              print('NO TARGET NEUROTRANSMITTER ROWS FOUND')

          print_section('NEUROTRANSMITTER ROW COUNT PER TARGET')
          for body_id in TARGET_IDS:
              rows = nt.loc[nt['body'].eq(body_id)]
              print(f'bodyId {body_id}: {len(rows)} row(s)')
              if len(rows):
                  print(rows.to_string(index=False))

          print_section('DIAGNOSTIC SUMMARY')
          print('Expected ORN census: 2639')
          print('Current ORN_* census: 2635')
          print('Difference: 4')
          print('')
          print('The four candidates are:')
          for body_id in TARGET_IDS:
              print(f'  {body_id}')
          print('')
          print('No source data has been modified.')
          print('This step is READ-ONLY.')
          print('')
          print('END FOUR MISSING ORN DIAGNOSTIC')
          PY

      - name: Download exact official MaleCNS connectome weights
        run: |
          set -euo pipefail
          mkdir -p build/malecns_raw
          URL='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o build/malecns_raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather
          echo 'e35da783d1c686b2b58b3b87cd6a403ae43bfcfba8bff28e08ef752c1a56afc1  build/malecns_raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather' | sha256sum -c -
          echo 'OFFICIAL WEIGHTS: OK'

      - name: Audit FBR-10-OLF1 reducer logic
        run: |
          set -euo pipefail
          python -m py_compile tools/build_connectome.py tools/test_olfactory_route_reduction.py
          python tools/test_olfactory_route_reduction.py

      - name: Build new FBR-10-OLF1 connectome
        run: |
          set -euo pipefail
          python tools/build_connectome.py
          test -s app/src/main/res/raw/malecns_reduced.bin
          test -s app/src/main/res/raw/malecns_reduced_report.json

      - name: Validate new FBR-10-OLF1 structural artifact
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_fbr10_olf1.py
          python tools/validate_fbr10_olf1.py \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --report app/src/main/res/raw/malecns_reduced_report.json

      - name: Build and validate anatomical olfactory input map
        run: |
          set -euo pipefail
          python -m py_compile tools/build_olfactory_input_map.py tools/test_olfactory_input_map.py
          python tools/build_olfactory_input_map.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --neurotransmitters build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/olfactory_input_map.tsv \
            --report build/OLF_INPUT_MAP_REPORT.json \
            --connectome-report app/src/main/res/raw/malecns_reduced_report.json
          cp build/OLF_INPUT_MAP_REPORT.json app/src/main/res/raw/olfactory_input_map_report.json
          python tools/test_olfactory_input_map.py
          test -s app/src/main/assets/olfactory_input_map.tsv

      - name: Build and validate V1.17.0 VNC semantics
        run: |
          set -euo pipefail
          python -m py_compile tools/build_vnc_motor_semantics.py tools/validate_vnc_motor_semantics.py tools/test_vnc_motor_semantics_logic.py
          python tools/test_vnc_motor_semantics_logic.py
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/build_vnc_motor_semantics.py').read_text()
          assert 'read_feather(' not in s, 'VNC semantics builder must not require pandas'
          assert 'feather.read_table(' in s, 'VNC semantics builder must use Arrow-native Feather reading'
          print('VNC FEATHER READER: PANDAS-FREE')
          PY
          python tools/build_vnc_motor_semantics.py \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --output app/src/main/assets/vnc_motor_semantics.tsv \
            --report build/VNC_MOTOR_SEMANTICS_REPORT.json
          python tools/validate_vnc_motor_semantics.py \
            --semantics app/src/main/assets/vnc_motor_semantics.tsv \
            --fbc103 app/src/main/res/raw/malecns_reduced.bin \
            --annotations build/malecns_raw/body-annotations-male-cns-v1.0-minconf-0.5.feather \
            --report build/VNC_MOTOR_SEMANTICS_REPORT.json
          cp build/VNC_MOTOR_SEMANTICS_REPORT.json app/src/main/res/raw/vnc_motor_semantics_report.json
          test -s app/src/main/assets/vnc_motor_semantics.tsv
          test -s app/src/main/res/raw/vnc_motor_semantics_report.json

      - name: Build FBD104 signed dynamics layer
        run: |
          set -euo pipefail
          NT='build/malecns_raw/body-neurotransmitters-male-cns-v1.0.feather'
          test -s "$NT"
          python -m py_compile tools/build_fbr10_dynamics.py tools/validate_fbr10_dynamics.py
          python tools/build_fbr10_dynamics.py --nt "$NT" --output app/src/main/res/raw/malecns_fbr10_dynamics.bin
          python tools/validate_fbr10_dynamics.py
          cp build/FBR10_DYNAMICS_REPORT.json app/src/main/res/raw/malecns_fbr10_dynamics_report.json

      - name: Validate V1.17.0 membrane integration
        run: |
          set -euo pipefail
          python -m py_compile tools/test_neural_time_integration.py
          python tools/test_neural_time_integration.py

      - name: Validate Kotlin source structure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/example/flybrain/MainActivity.kt').read_text()
          assert s.count('{') == s.count('}')
          assert s.count('(') == s.count(')')
          assert s.count('[') == s.count(']')
          assert 'calibrateSynapticGain' not in s
          assert 'java.util.Arrays.fill(sensoryCurrent, 0f)' in s
          assert 'loadDynamicsLayer()' in s
          assert 'loadVncMotorSemantics()' in s
          assert 'vnc_motor_semantics.tsv' in s
          assert 'val expectedHeader = "bodyId\\ttype\\tclass' in s, 'VNCSEM header must use real Kotlin tab escapes'
          assert 'bodyId\\\\ttype' not in s, 'VNCSEM header must not contain literal backslash-t sequences'
          assert 'MOTOR_FUNCTION_JUMP' in s
          assert 'externalContext' not in s
          assert 'INDEX-CYCLIC' not in s
          assert 'FOOD_OLF_PATTERN_CAP' not in s
          assert 'for (i in olfactoryNeuronIndices)' in s
          assert 'excludeOlfactory = true' in s
          assert 'olfactoryPopulationRate()' in s
          assert 'mechanosensoryPopulationRate()' in s
          print('KOTLIN STRUCTURE: OK')
          PY

      - name: Validate FBD104 artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct, hashlib
          from pathlib import Path
          fbc=Path('app/src/main/res/raw/malecns_reduced.bin')
          p=Path('app/src/main/res/raw/malecns_fbr10_dynamics.bin'); b=p.read_bytes()
          sb=fbc.read_bytes(); fn,fe=struct.unpack_from('<II',sb,8)
          assert b[:8] == b'FBD104\x00\x00'
          n,e=struct.unpack_from('<II',b,8)
          assert n==fn==16669 and len(b)==16+n+e*12
          d=json.loads(Path('build/FBR10_DYNAMICS_REPORT.json').read_text())
          assert d['neurons']==n and d['structural_edges']==fe
          assert d['source_structural_sha256']==hashlib.sha256(sb).hexdigest()
          print('FBD104: OK')
          PY

      - name: Compile APK V1.17.0-FOOD-OLFACTORY-ROUTED
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK V1.17.0-FOOD-OLFACTORY-ROUTED
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -Fq "versionCode='131'"
          echo "$BADGING" | grep -Fq "versionName='1.17.0'"
          unzip -l "$APK" | grep -Fq 'malecns_reduced.bin'
          unzip -l "$APK" | grep -Fq 'malecns_fbr10_dynamics.bin'
          unzip -l "$APK" | grep -Fq 'vnc_motor_semantics.tsv'
          unzip -l "$APK" | grep -Fq 'vnc_motor_semantics_report.json'
          sha256sum "$APK"

      - name: Upload V1.17.0 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.17.0-OLF1-AUDIT-EVIDENCE
          path: |
            app/src/main/res/raw/malecns_reduced.bin
            app/src/main/res/raw/malecns_reduced_report.json
            app/src/main/res/raw/malecns_fbr10_dynamics.bin
            app/src/main/res/raw/malecns_fbr10_dynamics_report.json
            app/src/main/res/raw/vnc_motor_semantics_report.json
            app/src/main/res/raw/olfactory_input_map_report.json
            app/src/main/assets/olfactory_input_map.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.17.0-FOOD-OLFACTORY-ROUTED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
